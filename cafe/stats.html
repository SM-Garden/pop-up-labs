<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Hanbat.Timothy">
<meta name="theme-color" content="#6b3e26">
<title>커피 주문 사용 통계</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --bg: #faf6f1; --surface-1: #ffffff; --line: #e8ddd2; --grid: #efe7de;
    --text-primary: #2b1d14; --text-secondary: #6e5e52; --text-muted: #8f8073;
    --brand: #6b3e26; --brand-ink: #ffffff;
    --series-1: #2a78d6; --series-2: #eb6834;
    --tip-bg: #2b1d14; --tip-ink: #faf6f1; --danger-bg: #fdeee5; --danger: #b4410f;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #17120e; --surface-1: #231b15; --line: #3a2e25; --grid: #2e241d;
      --text-primary: #f5ece4; --text-secondary: #c9b9ab; --text-muted: #9c8c7f;
      --brand: #d9a679; --brand-ink: #1a120c;
      --series-1: #3987e5; --series-2: #d95926;
      --tip-bg: #f5ece4; --tip-ink: #17120e; --danger-bg: #3a2014; --danger: #fb9a63;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17120e; --surface-1: #231b15; --line: #3a2e25; --grid: #2e241d;
    --text-primary: #f5ece4; --text-secondary: #c9b9ab; --text-muted: #9c8c7f;
    --brand: #d9a679; --brand-ink: #1a120c;
    --series-1: #3987e5; --series-2: #d95926;
    --tip-bg: #f5ece4; --tip-ink: #17120e; --danger-bg: #3a2014; --danger: #fb9a63;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text-primary); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.45; padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 12px; }
  h1 { font-size: 22px; word-break: keep-all; line-height: 1.2; }
  h1 small { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-top: 2px; }
  .btn { font: inherit; font-size: 14px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .seg { display: flex; gap: 6px; margin: 4px 0 14px; }
  .seg button { flex: 1; font: inherit; font-size: 15px; font-weight: 700; color: var(--text-secondary); background: var(--surface-1); border: 2px solid var(--line); border-radius: 10px; padding: 9px 4px; cursor: pointer; }
  .seg button[aria-pressed="true"] { border-color: var(--brand); color: var(--text-primary); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .k { font-size: 13px; color: var(--text-secondary); font-weight: 700; word-break: keep-all; }
  .tile .v { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 4px; }
  .tile .v small { font-size: 15px; font-weight: 700; margin-left: 2px; }
  .tile .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; word-break: keep-all; }
  .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .card h2 { font-size: 16px; }
  .card .sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 6px; font-size: 13px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .tip { min-height: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .tip b { color: var(--text-primary); font-size: 14px; width: 100%; }
  .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .chart .sel { fill: var(--grid); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { font-size: 12px; color: var(--text-secondary); font-weight: 700; border-top: 0; }
  th:first-child, td:first-child { text-align: left; }
  .tbl { overflow-x: auto; }
  .msg { text-align: center; color: var(--text-secondary); padding: 36px 10px; word-break: keep-all; }
  .err { background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 12px 14px; font-weight: 700; margin-top: 12px; word-break: keep-all; }
  .note { font-size: 13px; color: var(--text-muted); margin-top: 14px; word-break: keep-all; }
  @media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .v { font-size: 26px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>📊 사용 통계<small>단체 커피 주문</small></h1>
    <div style="display:flex;gap:6px">
      <button class="btn" id="reload">새로고침</button>
      <a class="btn" href="./">앱으로</a>
    </div>
  </header>

  <div class="seg" id="range" role="group" aria-label="기간">
    <button data-d="7">7일</button>
    <button data-d="30" aria-pressed="true">30일</button>
    <button data-d="90">90일</button>
    <button data-d="all">전체</button>
  </div>

  <div id="out"><p class="msg">불러오는 중…</p></div>

  <p class="note">이름이나 주문 내용은 저장하지 않고, 날짜별 숫자만 모아요. 같은 폰에서 하루에 여러 번 열어도 ‘총무 사용’은 한 번만 세요.</p>
  <p class="note" style="text-align:center">© 2026 Hanbat.Timothy. All rights reserved.</p>
</main>

<script>
(() => {
  // 앱과 같은 Firebase를 써요. 주소 뒤에 ?d=서버주소 를 붙이면 그 서버를 봐요.
  const DEFAULT_DB = 'cafe-order-c8098-default-rtdb.asia-southeast1.firebasedatabase.app';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('ko-KR');
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const appDb = () => { try { return (JSON.parse(localStorage.getItem('groupCafeOrder.v2') || '{}').db) || ''; } catch (e) { return ''; } };
  const dbHost = new URLSearchParams(location.search).get('d') || appDb() || DEFAULT_DB;
  const dbUrl = (/^https?:\/\//.test(dbHost) ? dbHost : 'https://' + dbHost).replace(/\/+$/, '');

  let raw = null, range = '30';
  try { range = localStorage.getItem('groupCafeOrder.statsRange') || '30'; } catch (e) {}

  async function fetchStats() {
    $('out').innerHTML = '<p class="msg">불러오는 중…</p>';
    try {
      const res = await fetch(`${dbUrl}/stats.json`);
      if (!res.ok) throw Object.assign(new Error('http'), { status: res.status });
      raw = (await res.json()) || {};
      render();
    } catch (e) {
      $('out').innerHTML = `<div class="err">${e.status === 401 || e.status === 403
        ? '통계를 읽을 권한이 없어요. Firebase 규칙에 stats 부분이 게시됐는지 확인해 주세요.'
        : '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'}</div>`;
    }
  }

  // 기간 안의 날짜 목록 (기록 없는 날도 0으로 채워요)
  function days() {
    const keys = Object.keys(raw).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const end = new Date(); end.setHours(0, 0, 0, 0);
    let start;
    if (range === 'all') {
      if (!keys.length) return [];
      const [y, m, d] = keys[0].split('-').map(Number); start = new Date(y, m - 1, d);
    } else { start = new Date(end); start.setDate(end.getDate() - (+range - 1)); }
    const out = [];
    for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) out.push(ymd(d));
    return out;
  }
  const val = (day, k) => +((raw[day] || {})[k] || 0);
  const sum = (list, k) => list.reduce((a, d) => a + val(d, k), 0);

  // 날짜가 많으면 달별로 묶어요
  function buckets(list) {
    if (list.length <= 92) return list.map((d) => ({ key: d, label: `${+d.slice(5, 7)}/${+d.slice(8)}`, title: `${+d.slice(5, 7)}월 ${+d.slice(8)}일`, days: [d] }));
    const map = new Map();
    list.forEach((d) => { const k = d.slice(0, 7); if (!map.has(k)) map.set(k, []); map.get(k).push(d); });
    return [...map].map(([k, ds]) => ({ key: k, label: `${+k.slice(5)}월`, title: `${k.slice(0, 4)}년 ${+k.slice(5)}월`, days: ds }));
  }

  function render() {
    document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === range)));
    const list = days();
    const rooms = sum(list, 'rooms'), guest = sum(list, 'guestOrders'), host = sum(list, 'hostOrders');
    const cups = guest + host, opens = sum(list, 'guestOpens'), hostDays = sum(list, 'hostDevices');
    const ai = sum(list, 'scanAi'), local = sum(list, 'scanLocal');
    const linkPct = cups ? Math.round((guest / cups) * 100) : 0;
    const label = range === 'all' ? '전체 기간' : `최근 ${range}일`;

    if (!list.length || !(rooms + cups + opens + hostDays + ai + local)) {
      $('out').innerHTML = `<p class="msg">${label} 동안 기록이 없어요.<br>앱에서 주문을 받으면 여기에 숫자가 쌓여요.</p>`;
      return;
    }
    const tile = (k, v, unit, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div><div class="s">${s}</div></div>`;
    const bs = buckets(list);
    $('out').innerHTML = `
      <div class="tiles">
        ${tile('단체 주문', num(rooms), '번', '단톡방 링크를 보낸 횟수')}
        ${tile('주문된 음료', num(cups), '잔', `링크 ${num(guest)} · 대신 누름 ${num(host)}`)}
        ${tile('링크로 주문', linkPct, '%', '일행이 직접 고른 비율')}
        ${tile('링크 연 사람', num(opens), '명', '방마다 폰 한 대씩')}
        ${tile('총무 사용', num(hostDays), '일', '폰마다 하루 한 번씩')}
        ${tile('메뉴판 읽기', num(ai + local), '번', `AI ${num(ai)} · 폰 안 ${num(local)}`)}
      </div>
      <div class="card">
        <h2>${bs.length === list.length ? '날마다' : '달마다'} 주문된 음료</h2>
        <p class="sub">${label}</p>
        <div class="legend"><span><i style="background:var(--series-1)"></i>링크로 주문</span><span><i style="background:var(--series-2)"></i>총무가 대신 누름</span></div>
        <div class="tip" id="tip" aria-live="polite">막대를 누르면 그날 숫자가 여기 보여요</div>
        <div class="chart" id="chart"></div>
      </div>
      <div class="card">
        <h2>${bs.length === list.length ? '날짜별' : '달별'} 표</h2>
        <div class="tbl"><table>
          <thead><tr><th>${bs.length === list.length ? '날짜' : '달'}</th><th>단체 주문</th><th>링크 주문</th><th>대신 누름</th><th>연 사람</th></tr></thead>
          <tbody>${bs.slice().reverse().filter((b) => ['rooms', 'guestOrders', 'hostOrders', 'guestOpens', 'scanAi', 'scanLocal', 'hostDevices'].some((k) => sum(b.days, k)))
            .map((b) => `<tr><td>${esc(b.title)}</td><td>${num(sum(b.days, 'rooms'))}</td><td>${num(sum(b.days, 'guestOrders'))}</td><td>${num(sum(b.days, 'hostOrders'))}</td><td>${num(sum(b.days, 'guestOpens'))}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    drawChart(bs);
  }

  // 쌓은 막대: 아래 링크 주문, 위 대신 누름. 2px 틈, 끝만 둥글게
  let lastBs = null;
  function drawChart(bs) {
    lastBs = bs;
    const box = $('chart'); if (!box) return;
    const W = Math.max(280, box.clientWidth), H = 190, L = 30, R = 6, T = 10, B = 24;
    const data = bs.map((b) => ({ b, g: sum(b.days, 'guestOrders'), h: sum(b.days, 'hostOrders'), r: sum(b.days, 'rooms') }));
    const max = Math.max(1, ...data.map((d) => d.g + d.h));
    const step = max <= 4 ? 1 : Math.ceil(max / 4 / Math.pow(10, Math.floor(Math.log10(max / 4)))) * Math.pow(10, Math.floor(Math.log10(max / 4)));
    const top = Math.ceil(max / step) * step;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const slot = (W - L - R) / data.length, bw = Math.max(2, Math.min(28, slot - 2));
    const x = (i) => L + slot * i + (slot - bw) / 2;
    const rr = Math.min(4, bw / 2);
    // 둥근 끝 막대 (위만 둥글게)
    const topRound = (x0, y0, w, h) => h <= 0 ? '' : h < rr ? `M${x0},${y0 + h}V${y0}H${x0 + w}V${y0 + h}Z`
      : `M${x0},${y0 + h}V${y0 + rr}Q${x0},${y0} ${x0 + rr},${y0}H${x0 + w - rr}Q${x0 + w},${y0} ${x0 + w},${y0 + rr}V${y0 + h}Z`;
    let g = `<rect class="sel" x="0" y="${T}" width="0" height="${H - T - B}" rx="4" style="display:none"/>`;
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
    const every = Math.ceil(data.length / Math.floor((W - L - R) / 44));
    data.forEach((d, i) => {
      const x0 = x(i), base = y(0), gh = base - y(d.g), hh = base - y(d.g + d.h);
      const hasH = d.h > 0, gap = hasH && d.g > 0 ? 2 : 0;
      if (d.g) g += `<path d="${hasH ? `M${x0},${base}V${base - gh}H${x0 + bw}V${base}Z` : topRound(x0, base - gh, bw, gh)}" fill="var(--series-1)"/>`;
      if (d.h) g += `<path d="${topRound(x0, base - hh, bw, hh - gh - gap)}" fill="var(--series-2)"/>`;
      if (i % every === 0 || (i === data.length - 1 && i % every >= every * 0.7)) g += `<text class="axis" x="${x0 + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(d.b.label)}</text>`;
      g += `<rect class="hit" data-i="${i}" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>`;
    });
    g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;
    const tip = $('tip');
    box.querySelector('svg')?.remove();
    box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.length)}개 구간의 주문된 음료 막대 그래프">${g}</svg>`);
    const show = (i) => {
      const d = data[i]; if (!d) return;
      tip.innerHTML = `<b>${esc(d.b.title)} · ${num(d.g + d.h)}잔</b><span><i style="background:var(--series-1)"></i>링크로 주문 ${num(d.g)}</span><span><i style="background:var(--series-2)"></i>대신 누름 ${num(d.h)}</span><span>단체 주문 ${num(d.r)}번</span>`;
      const sel = box.querySelector('.sel');
      sel.setAttribute('x', L + slot * i); sel.setAttribute('width', slot); sel.style.display = '';
    };
    box.querySelectorAll('.hit').forEach((r) => {
      r.addEventListener('pointerenter', () => show(+r.dataset.i));
      r.addEventListener('pointerdown', () => show(+r.dataset.i));
    });
  }

  $('range').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    range = b.dataset.d; try { localStorage.setItem('groupCafeOrder.statsRange', range); } catch (er) {}
    if (raw) render();
  });
  $('reload').addEventListener('click', fetchStats);
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => lastBs && drawChart(lastBs), 150); });
  fetchStats();
})();
</script>
</body>
</html>
